[project]
name = "quant-research"
version = "0.1.0"
description = "Quant-Research"
authors = [
    {name = "ZouZeus"}
]
license = {text = ""}
readme = "README.md"

requires-python = ">=3.13"
dependencies = [
    "numpy (>=1.24,<3.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "scipy (>=1.16.3,<2.0.0)",
    "scikit-learn (>=1.7.2,<2.0.0)",
    "statsmodels (>=0.14.5,<0.15.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    "plotly (>=5.0.0,<6.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "pandas-ta (>=0.4.71b0,<0.5.0)",
    "pandas-datareader (>=0.10.0,<0.11.0)",
    "yfinance (>=0.2.66,<0.3.0)",
    "tabulate (>=0.9.0,<0.10.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "skfolio (>=0.14.2,<0.15.0)",
    "backtrader (>=1.9.78.123,<2.0.0.0)",
    "colorama (>=0.4.6,<0.5.0)",
    "textblob (>=0.19.0,<0.20.0)",
    "vadersentiment (>=3.3.2,<4.0.0)",
    "nltk (>=3.9.2,<4.0.0)",
    "powerlaw (>=1.5,<2.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.1.0,<8.0.0)",
    "yahoo-fin (>=0.8.9.1,<0.9.0.0)"
]
